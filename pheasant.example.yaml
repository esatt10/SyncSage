deployment:
  compose:
    image_repository: ghcr.io/esatt10/pheasant
    image_tag: 0.9.2
    workspace_path: .
    vault_path: ./vault

pheasant:
  name: local-pheasant
  description: Lightweight MCP knowledge graph and retrieval server
  environment: local
  log_level: INFO
  state_path: /state
  vault_path: /vault
  workspace_root: /workspace
  exports_path: /exports

server:
  host: 0.0.0.0
  port: 8765
  mcp:
    enabled: true
    transports:
      stdio: true
      streamable_http: true
      sse: false
  api:
    enabled: true
    openapi: true
    # Browser origins allowed to call this API. The API is unauthenticated,
    # so this list is what stops an arbitrary page in the user's browser from
    # scripting it. The shipped UI proxies /api/* same-origin and needs none
    # of these; they cover running the UI dev server or a separate host.
    cors_origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:8765
      - http://127.0.0.1:8765
      - http://localhost:8080
      - http://127.0.0.1:8080
      - http://localhost:3000
      - http://127.0.0.1:3000
    # Restores the old `*` behavior. Only for deployments fronted by an
    # ingress that authenticates before the request reaches pheasant.
    cors_allow_all_origins: false
  ui:
    enabled: true
    graph_visualization: true

storage:
  graph_format: node_link_json
  # Synapse 21.6A: zstd-compressed timestamped graph snapshots written after a
  # successful sync (graphs/<kb_id>/graph.<utc-ts>.json.zst), beside the
  # uncompressed graph.latest.json. Throttled by the interval; bounded by the
  # retention cap (oldest evicted first; latest.json/db/contract never evicted).
  graph_snapshots: true
  graph_snapshot_interval_seconds: 900
  # How often an in-progress sync writes graph.latest.json. The graph used to
  # reach disk only when a sync *finished*, so stopping the container during a
  # long first index threw that work away and the next start had to rebuild it.
  # 0 = save at end of sync only.
  graph_checkpoint_seconds: 60
  compression: zstd
  sqlite_path: /state/pheasant.db
  graph_path: /state/graphs
  manifest_path: /state/manifests
  max_state_size_gb: 10

search:
  default_mode: hybrid
  keyword:
    enabled: true
    engine: sqlite_fts5
  # Optional semantic self-search (Synapse 21.4). Disabled by default; when
  # enabled, chunks are embedded at sync time through an OpenAI-spec HTTP
  # endpoint (the only sanctioned network call in the indexing path) and
  # search gains mode=vector plus vector candidates inside mode=hybrid.
  embeddings:
    enabled: false
    provider: openai-spec        # "openai-spec" | "stub" (deterministic, offline)
    model: text-embedding-3-small
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY  # env var NAME; the key itself never lands in config
    # Unset = use the model's own native size (1536 for text-embedding-3-small,
    # 3072 for -3-large). Set a number only to shrink vectors for storage or to
    # pin an exact size across a Synapse fleet.
    dimensions: null
    batch_size: 64
  vector_store:
    provider: lancedb            # "lancedb" (pip install 'pheasant-kb[vector]') | "numpy"
    path: /state/vectors         # vectors live under <path>/<kb_id>/
  ranking:
    prefer_exact_path_matches: true
    prefer_recent_commits: true
    graph_neighbor_boost: true
    max_results_default: 10
  # Run graph_search._scan_edges through the vendored WASM accelerator
  # (Synapse 34.5b) instead of pure Python. Needs the [wasm] extra; falls back
  # to pure Python on any failure or if the extra is missing, so it is never a
  # correctness dependency. A consistent, growing win on the relationship-search
  # query path. Off here, but the Docker image turns it ON in a config it
  # generates itself, since that image always installs [wasm].
  wasm_relationship_search: false

# Knowledge-graph construction.
graph:
  # Run resolve_cross_source_edges (import/link resolution across sources)
  # through the same vendored accelerator (Synapse 34.5a). Same fallback
  # guarantee as above. Conditional win per the 34.4 benchmark: it LOSES to
  # pure Python below roughly 1,300-2,500 cross-source edges and wins above
  # it, so leave it off for a small static corpus and turn it on for a large
  # or growing multi-source graph. The Docker image turns it ON, on the
  # assumption a container's graph grows past that crossover.
  wasm_cross_source_resolution: false
  # Minimum documents a concept must appear in to be kept.
  concept_min_documents: 2

sync:
  # Guardrails on how much one filesystem source may pull in. A source may
  # point at any readable path, so "I accidentally indexed my home directory"
  # is a realistic mistake — these turn it into a refusal with an actionable
  # message instead of a process that eats memory until it dies. Checked
  # during traversal, before any file is read.
  #
  # Run `pheasant scan` to see what a source would index before syncing it.
  # A source over budget indexes NOTHING (a partial index would be
  # non-deterministic); narrow it with max_depth / include / exclude, raise
  # these numbers, or sync once with --full-scan.
  limits:
    max_files: 50000        # matching files, after include/exclude
    max_file_size_mb: 25    # skip any single file larger than this
    max_total_mb: 4096      # total matched content
    follow_symlinks: false  # home dirs are full of links that escape or loop
  startup:
    full_validation: true
    repair_missing_indexes: true
  watcher:
    enabled: true
    max_watch_paths: 100
    debounce_ms: 1500
    batch_window_ms: 5000
  git:
    enabled: true
    detect_commit_changes: true
    detect_branch_switch: true
    reindex_on_commit: true
    reindex_on_branch_switch: validate_only
  scheduler:
    enabled: true
    interval_seconds: 900
  idempotency:
    hash_algorithm: sha256
    compare_size_mtime_hash: true
    skip_unchanged_files: true
  concurrency:
    max_parallel_sources: 4
    max_parallel_files: 8
    max_parallel_embeddings: 4
    file_executor: thread # thread | process | remote
    remote_worker_urls: []
    remote_worker_enabled: false
    remote_worker_token_env: PHEASANT_INDEX_WORKER_TOKEN
    remote_worker_timeout_seconds: 120
    lock_timeout_seconds: 120

# Turning binary/markup files into indexable text. Every handler here is
# opt-in by file extension: a source whose `include` globs admit only code and
# markdown builds none of them, and behaves exactly as it would without this
# section. Only the captioner and transcriber can make network calls, and both
# default to a deterministic offline stub.
ingestion:
  # Document text extraction: .pdf .docx .doc .pptx .xlsx .rtf .epub
  # Without it a document is discovered and hashed but contributes ZERO
  # chunks — findable by path, invisible by content.
  # Built only when a source's `include` admits one of those extensions.
  # Every provider is fully offline and deterministic (no model, no network).
  extractor:
    provider: auto        # "auto" (pymupdf/python-docx, falling back to the
                          #   pure-stdlib reader) | "native" | "builtin"
                          #   (stdlib only) | "sandboxed" (PDF tokenizer inside
                          #   the WASM fuel/memory cap with zero host
                          #   capabilities — for untrusted connector PDFs;
                          #   needs pip install 'pheasant-kb[wasm]')
    html_text: false      # strip markup from .html/.htm/.xhtml so their prose
                          #   indexes instead of their tags. OFF by default:
                          #   those extensions have always indexed as raw
                          #   markup, so enabling it changes existing chunk
                          #   boundaries and is an explicit choice.
  # Image captioning — built only when `include` admits an image extension.
  captioner:
    provider: stub        # "stub" (deterministic, offline) | "openai-spec"
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY   # env var NAME; the key never lands in config
  # Audio transcription — built only when `include` admits an audio extension.
  transcriber:
    provider: stub        # "stub" (deterministic, offline) | "openai-spec"
    model: whisper-1
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

obsidian:
  enabled: true
  write_mode: upsert
  note_root: pheasant
  template_profile: engineering
  create_index_notes: true
  create_source_notes: true
  create_file_notes: true
  create_chunk_notes: true
  create_canvas: true
  frontmatter:
    include_source_id: true
    include_hash: true
    include_last_indexed: true
    include_graph_node_id: true
  backlinks:
    enabled: true
    style: wikilink
  tags:
    base:
      - pheasant
    by_source_type: true

security:
  allow_workspace_roots:
    - /workspace
    - /vault
    - /exports
    # Extra mount for local files that live outside ./workspace. Point the
    # PHEASANT_DATA_PATH env var (docker-compose.yml) at any host directory and
    # it shows up here at /data — then register a source under /data.
    - /data
  allow_user_selected_source_paths: true
  read_only_sources: true
  deny_path_traversal: true
  default_exclude_secrets: true

# Synapse federation (Synapse 21.5). Standalone-safe: every router-facing
# behavior is a no-op unless you opt in here. With the defaults below the
# region behaves exactly like a router-less pheasant.
#
# synapse:
#   publish: false               # gate contract publication + sync event stream
#   router_url: null             # e.g. http://synapse-router:8000 (POST sync.completed)
#   fleet_id: null               # fleet label stamped into the contract
#   endpoint: null               # this region's reachable base URL, e.g.
#                                # http://my-region:8765 (router pulls GET /contract)
#   webhook_timeout_seconds: 5.0
#
# When synapse.publish is true, each successful indexing sync (re)writes
# <state>/contract.latest.json (served at GET /contract and the MCP resource
# pheasant://knowledge-bases/{kb_id}/contract) and appends a sync.completed
# record to <state>/events/YYYY-MM-DD.ndjson. When router_url is also set, the
# event (with the inline contract) is POSTed to <router_url>/v1/synapse/events;
# webhook failures are logged, never raised.

# Grounded chat over your index (the UI's chat layer). Query-time only — no
# LLM ever runs during indexing, so re-syncing unchanged content stays
# Agent memory. Records are append-only Markdown files written by agents
# (MCP `memory_write` / `POST /memory`) into a `type: memory` source and
# indexed by the ordinary pipeline — recall is just search, there is no second
# retrieval path. This block controls consolidation, how memory takes part in
# retrieval, and how the store is bounded.
#
# A *corrected* record is dropped from results at query time, without waiting
# for consolidation; pass `{"current_only": false}` or an `as_of` instant on a
# search to see it again.
memory:
  # Archive superseded and TTL-expired records on the scheduler beat. The file
  # is renamed `<id>.md.archived` in place — bytes preserved, never deleted.
  consolidation_enabled: true
  # Per-scope age limits. null = that scope never expires by age.
  session_ttl_days: null
  user_ttl_days: null
  org_ttl_days: null
  # How memory takes part in a search that does not say. A per-call `memory`
  # argument always wins over this. auto | off | only | prefer
  default_policy: auto
  # Let `alias`/`preference`/`exclusion` records re-rank results, not merely be
  # retrievable. Off by default: a memory that silently re-orders searches is a
  # surprise unless it was asked for.
  steering_enabled: false
  # Count which records retrieval returns, so salience reflects use. Off by
  # default — a write on the read path, and an operator's decision to make.
  usage_tracking: false
  # Archive the least salient records past this many. null = unbounded.
  max_records: null
  # Cap on `about` graph edges drawn per record by the memory bridge.
  about_max_targets: 3

# byte-for-byte deterministic.
#
# With no provider reachable the assistant still answers, extractively: the
# top retrieved passages with their citations and graph facts. Point it at a
# model to get those passages synthesized into prose.
assistant:
  enabled: true
  # auto | anthropic | openai | gemini | none
  # "auto" picks the first provider whose key env var is set on the container
  # (ANTHROPIC_API_KEY, then OPENAI_API_KEY, then GEMINI_API_KEY).
  provider: auto
  # model: claude-sonnet-5      # provider default when unset
  # base_url: https://api.anthropic.com
  # api_key_env: ANTHROPIC_API_KEY   # env var NAME; the key never lands in config
  # Let a UI user paste their own key for the life of a browser session. It is
  # held in the server's memory behind an opaque token — never written to this
  # file, to /state, or to logs — and dropped on expiry, revoke or restart.
  allow_session_keys: true
  session_key_ttl_minutes: 720
  max_context_chunks: 8
  max_output_tokens: 4096
  request_timeout_seconds: 90.0
  max_facts: 12
  # Which agent workflow answers a question.
  #   auto     — "agentic" when a model is connected AND the [agent] extra is
  #              installed, otherwise "simple". Never fails closed.
  #   agentic  — LangGraph: plan → retrieve (multi-mode) → expand over the
  #              graph → grade the evidence → synthesize → verify citations,
  #              looping back to re-plan while the evidence is thin.
  #   simple   — one retrieval pass, one synthesis call.
  # Register your own under the `pheasant.agent_workflows` entry-point group
  # and name it here; see docs/how-to/agent-workflows.md.
  workflow: auto
  # Per-workflow tuning, merged over the workflow's defaults. Callers can
  # override any of these per request (`options` on POST /assistant/chat and
  # on the MCP tool `ask_knowledge_base`).
  workflow_options: {}
  #  agentic:
  #    max_rounds: 2
  #    retrieval_modes: [hybrid, vector]
  #    expand_graph: true
  #    max_context_passages: 10

sources:
  - name: pheasant-repo
    type: repository
    path: /workspace
    description: pheasant repository mounted from the cloned repo root
    enabled: true
    include:
      - "**/*.py"
      - "**/*.md"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.toml"
      - "**/Dockerfile"
    exclude:
      - "**/.git/**"
      - "**/.env"
      - "**/.env.*"
      - "**/*id_rsa*"
      - "**/*id_ed25519*"
      - "**/*.pem"
      - "**/*.key"
      - "**/__pycache__/**"
      - "**/.venv/**"
      - "**/.pheasant/**"
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "docs/**"
      - "exports/**"
      - "state/**"
      - "vault/**"
      - "workspace/**"
    repo:
      branch_policy: current
      include_uncommitted: true
      commit_trigger: true
      dependency_graph:
        enabled: true
        languages:
          python: true
          javascript: false
          typescript: false
    chunking:
      enabled: true
      strategy: semantic
      max_chars: 4000
      overlap_chars: 400
    sync:
      on_startup: true
      on_file_change: debounce
      on_git_commit: true
      interval_seconds: 900

  - name: existing-obsidian-vault
    type: obsidian_vault
    path: /vault
    description: Optional existing Obsidian vault to index as a source
    enabled: false
    include:
      - "**/*.md"
      - "**/*.canvas"
    exclude:
      - "**/.obsidian/**"
      - "**/.trash/**"
    sync:
      on_startup: true
      on_file_change: debounce

  - name: pheasant-docs
    type: document_folder
    path: /workspace/docs
    description: pheasant documentation folder from the cloned repo root
    enabled: true
    include:
      - "**/*.pdf"
      - "**/*.docx"
      - "**/*.txt"
      - "**/*.md"
      - "**/*.html"
      - "**/*.xml"
    exclude:
      - "**/~$*"
      - "**/.git/**"
      - "**/.env*"
      - "**/*.pem"
      - "**/*.key"
    chunking:
      enabled: true
      strategy: heading_or_page
      max_chars: 5000
      overlap_chars: 500
    # Structural taxonomy extraction, for books / procedures / standards /
    # contracts: detect the outline the document already declares (Chapter,
    # Article, Section, § 12.3, 1.2.3, (a)) and use it as retrieval structure.
    # Chunks become sections labelled with their breadcrumb (`heading_path`,
    # which FTS weights at 2.0 — double the body text), `heading` graph nodes
    # + `has_heading` edges are emitted, and GET /taxonomy renders the tree.
    #
    # OFF by default and deliberately per-source: `1. Introduction` in a
    # standard is a section while `1. Buy milk` in a note is a list item, and
    # nothing in the line tells them apart. Enabling it is how you say "this
    # source really is structured documentation". It changes this source's FTS
    # content and chunk boundaries, so re-sync with --mode full after turning
    # it on. Set it at registration (POST /sources, quick-add, MCP) too.
    taxonomy:
      enabled: false
      max_depth: 6          # deepest heading level kept (1-6)
      detect: []            # [] = all rules; narrow with any of:
                            #   markdown | keyword | code | numbered
                            #   | lettered | caps   (caps is the noisiest)
      graph_nodes: true     # emit `heading` nodes + `has_heading` edges
      split_on_sections: true   # one chunk per section (still split when a
                            #   section exceeds chunking.max_chars)
    sync:
      on_startup: true
      on_file_change: debounce
      interval_seconds: 3600
