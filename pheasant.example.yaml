deployment:
  compose:
    image_repository: ghcr.io/esatt10/pheasant
    image_tag: 0.12.1
    workspace_path: .

pheasant:
  name: local-pheasant
  description: Lightweight MCP knowledge graph and retrieval server
  environment: local
  log_level: INFO
  state_path: /state
  workspace_root: /workspace
  exports_path: /exports

server:
  host: 0.0.0.0
  port: 8765
  # Which jobs this process takes on. `all` is the default and is what a
  # single container should stay on. In a fleet, split them so N serving
  # replicas do not each watch the same directories and each try to index the
  # same source:
  #   all      — serve, watch, schedule, index (one container)
  #   api      — serve only; publishes index work instead of running it, so
  #              it REQUIRES sync.queue.enabled and an indexer on that queue
  #   indexer  — watch, schedule and drain the queue (one per shard)
  #   worker   — preparation only (see sync.concurrency.remote_worker_enabled)
  # `pheasant serve --role <name>` overrides this.
  role: all
  mcp:
    enabled: true
    transports:
      stdio: true
      streamable_http: true
      sse: false
  api:
    enabled: true
    openapi: true
    # Browser origins allowed to call this API. The API is unauthenticated,
    # so this list is what stops an arbitrary page in the user's browser from
    # scripting it. The shipped UI proxies /api/* same-origin and needs none
    # of these; they cover running the UI dev server or a separate host.
    cors_origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:8765
      - http://127.0.0.1:8765
      - http://localhost:8080
      - http://127.0.0.1:8080
      - http://localhost:3000
      - http://127.0.0.1:3000
    # Restores the old `*` behavior. Only for deployments fronted by an
    # ingress that authenticates before the request reaches pheasant.
    cors_allow_all_origins: false
    # Requests in flight before the surplus is refused with 429 +
    # Retry-After. 0 disables it, which is right for one container: there is
    # nowhere else for a shed request to go, so waiting beats refusing. Set
    # it on replicas, where a fast 429 lets a load balancer try another one.
    # /health, /ready and /metrics are never shed — a pod that 429s its own
    # liveness probe gets restarted by the thing protecting it.
    max_concurrent_requests: 0
    # Seconds to keep serving after SIGTERM while /ready already reports 503.
    # Kubernetes removes endpoints and sends SIGTERM concurrently, and
    # endpoint propagation is not instant, so a process that exits promptly
    # drops what was routed to it in the gap. Keep this comfortably shorter
    # than terminationGracePeriodSeconds. 0 disables the delay.
    drain_seconds: 0
    # How often an `api`-role replica re-reads a graph the indexer wrote.
    # The graph is a FILE: a process loads it once at startup, and the only
    # other reload happens after a sync that same process ran. An api replica
    # never indexes, so without this it answers graph queries from whatever
    # the graph was when it started — silently, while text and vector search
    # stay current from the shared database. Ignored by the other roles.
    graph_refresh_seconds: 30
  ui:
    enabled: true
    graph_visualization: true

storage:
  graph_format: node_link_json
  # Synapse 21.6A: zstd-compressed timestamped graph snapshots written after a
  # successful sync (graphs/<kb_id>/graph.<utc-ts>.json.zst), beside the
  # uncompressed graph.latest.json. Throttled by the interval; bounded by the
  # retention cap (oldest evicted first; latest.json/db/contract never evicted).
  graph_snapshots: true
  graph_snapshot_interval_seconds: 900
  # How often an in-progress sync writes graph.latest.json. The graph used to
  # reach disk only when a sync *finished*, so stopping the container during a
  # long first index threw that work away and the next start had to rebuild it.
  # 0 = save at end of sync only.
  graph_checkpoint_seconds: 60
  compression: zstd
  sqlite_path: /state/pheasant.db
  graph_path: /state/graphs
  manifest_path: /state/manifests
  max_state_size_gb: 10

search:
  default_mode: hybrid
  keyword:
    enabled: true
    engine: sqlite_fts5
  # Optional semantic self-search (Synapse 21.4). Disabled by default; when
  # enabled, chunks are embedded at sync time through an OpenAI-spec HTTP
  # endpoint (the only sanctioned network call in the indexing path) and
  # search gains mode=vector plus vector candidates inside mode=hybrid.
  embeddings:
    enabled: false
    provider: openai-spec        # "openai-spec" | "stub" (deterministic, offline)
    model: text-embedding-3-small
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY  # env var NAME; the key itself never lands in config
    # Unset = use the model's own native size (1536 for text-embedding-3-small,
    # 3072 for -3-large). Set a number only to shrink vectors for storage or to
    # pin an exact size across a Synapse fleet.
    dimensions: null
    batch_size: 64
  vector_store:
    provider: lancedb            # "lancedb" (pip install 'pheasant-kb[vector]') | "numpy"
    path: /state/vectors         # vectors live under <path>/<kb_id>/
  ranking:
    prefer_exact_path_matches: true
    prefer_recent_commits: true
    graph_neighbor_boost: true
    max_results_default: 10
  # Run graph_search._scan_edges through the vendored WASM accelerator
  # (Synapse 34.5b) instead of pure Python. Needs the [wasm] extra; falls back
  # to pure Python on any failure or if the extra is missing, so it is never a
  # correctness dependency. A consistent, growing win on the relationship-search
  # query path. Off here, but the Docker image turns it ON in a config it
  # generates itself, since that image always installs [wasm].
  wasm_relationship_search: false

# Knowledge-graph construction.
graph:
  # Run resolve_cross_source_edges (import/link resolution across sources)
  # through the same vendored accelerator (Synapse 34.5a). Same fallback
  # guarantee as above. Conditional win per the 34.4 benchmark: it LOSES to
  # pure Python below roughly 1,300-2,500 cross-source edges and wins above
  # it, so leave it off for a small static corpus and turn it on for a large
  # or growing multi-source graph. The Docker image turns it ON, on the
  # assumption a container's graph grows past that crossover.
  wasm_cross_source_resolution: false

sync:
  # Guardrails on how much one filesystem source may pull in. A source may
  # point at any readable path, so "I accidentally indexed my home directory"
  # is a realistic mistake — these turn it into a refusal with an actionable
  # message instead of a process that eats memory until it dies. Checked
  # during traversal, before any file is read.
  #
  # Run `pheasant scan` to see what a source would index before syncing it.
  # A source over budget indexes NOTHING (a partial index would be
  # non-deterministic); narrow it with max_depth / include / exclude, raise
  # these numbers, or sync once with --full-scan.
  limits:
    max_files: 50000        # matching files, after include/exclude
    max_file_size_mb: 25    # skip any single file larger than this
    max_total_mb: 4096      # total matched content
    follow_symlinks: false  # home dirs are full of links that escape or loop
  startup:
    full_validation: true
    repair_missing_indexes: true
  watcher:
    enabled: true
    max_watch_paths: 100
    debounce_ms: 1500
    batch_window_ms: 5000
  git:
    enabled: true
    detect_commit_changes: true
    detect_branch_switch: true
    reindex_on_commit: true
    reindex_on_branch_switch: validate_only
  scheduler:
    enabled: true
    interval_seconds: 900
  idempotency:
    hash_algorithm: sha256
    compare_size_mtime_hash: true
    skip_unchanged_files: true
  concurrency:
    max_parallel_sources: 4
    max_parallel_files: 8
    max_parallel_embeddings: 4
    file_executor: thread # thread | process | remote
    remote_worker_urls: []
    remote_worker_enabled: false
    remote_worker_token_env: PHEASANT_INDEX_WORKER_TOKEN
    remote_worker_timeout_seconds: 120
    # Files per request to a worker. A batch amortizes request overhead and
    # carries one deadline for the group, but every task in it holds its
    # file's bytes in memory on both sides — a memory knob as much as a
    # throughput one.
    remote_worker_batch_size: 8
    # http (stdlib, no extra) | grpc (needs the [grpc] extra; carries file
    # bytes raw instead of base64, and streams results so one refused file
    # does not fail the batch). Retry, failover, circuit breakers, deadlines
    # and idempotency keys are transport-independent — this changes only the
    # bytes on the wire.
    worker_transport: http
    lock_timeout_seconds: 120

  # The durable index work queue. OFF by default: with it off, a sync holds
  # its remaining sources in a Python list, which is fine for one container
  # indexing a few folders. Turn it on when the backlog needs to outlive the
  # process holding it — a sync killed nine sources into ten then resumes on
  # the tenth, the depth becomes a number an HPA/KEDA can scale on, and a
  # source that keeps failing is dead-lettered instead of retried forever.
  #
  # At-least-once delivery is safe because indexing is already idempotent by
  # design (content sha256 + stable IDs): a redelivered task re-indexes to
  # identical state.
  #
  #   pheasant queue status / drain / requeue-dead
  queue:
    enabled: false
    backend: local          # local (this KB's own database, no broker to run)
                            #   | nats (JetStream; needs the [queue] extra)
    visibility_seconds: 300 # how long a claimed task is invisible to other
                            #   workers; heartbeats extend it, so this bounds
                            #   SILENCE from a claimer, not work
    max_attempts: 3         # then dead-lettered — kept, never deleted
    nats_servers: []        # e.g. ["nats://nats:4222"]
    nats_stream: PHEASANT_INDEX
    nats_subject: pheasant.index.tasks
    nats_durable: pheasant-indexers

# Turning binary/markup files into indexable text. Every handler here is
# opt-in by file extension: a source whose `include` globs admit only code and
# markdown builds none of them, and behaves exactly as it would without this
# section. Only the captioner and transcriber can make network calls, and both
# default to a deterministic offline stub.
ingestion:
  # Document text extraction: .pdf .docx .doc .pptx .xlsx .rtf .epub
  # Without it a document is discovered and hashed but contributes ZERO
  # chunks — findable by path, invisible by content.
  # Built only when a source's `include` admits one of those extensions.
  # Every provider is fully offline and deterministic (no model, no network).
  extractor:
    provider: auto        # "auto" (pymupdf/python-docx, falling back to the
                          #   pure-stdlib reader) | "native" | "builtin"
                          #   (stdlib only) | "sandboxed" (PDF tokenizer inside
                          #   the WASM fuel/memory cap with zero host
                          #   capabilities — for untrusted connector PDFs;
                          #   needs pip install 'pheasant-kb[wasm]')
    html_text: false      # strip markup from .html/.htm/.xhtml so their prose
                          #   indexes instead of their tags. OFF by default:
                          #   those extensions have always indexed as raw
                          #   markup, so enabling it changes existing chunk
                          #   boundaries and is an explicit choice.
  # Image captioning — built only when `include` admits an image extension.
  captioner:
    provider: stub        # "stub" (deterministic, offline) | "openai-spec"
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY   # env var NAME; the key never lands in config
  # Audio transcription — built only when `include` admits an audio extension.
  transcriber:
    provider: stub        # "stub" (deterministic, offline) | "openai-spec"
    model: whisper-1
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

security:
  allow_workspace_roots:
    - /workspace
    - /exports
    # Extra mount for local files that live outside ./workspace. Point the
    # PHEASANT_DATA_PATH env var (docker-compose.yml) at any host directory and
    # it shows up here at /data — then register a source under /data.
    - /data
  allow_user_selected_source_paths: true
  read_only_sources: true
  deny_path_traversal: true
  default_exclude_secrets: true

# Synapse federation (Synapse 21.5). Standalone-safe: every router-facing
# behavior is a no-op unless you opt in here. With the defaults below the
# region behaves exactly like a router-less pheasant.
#
# synapse:
#   publish: false               # gate contract publication + sync event stream
#   router_url: null             # e.g. http://synapse-router:8000 (POST sync.completed)
#   fleet_id: null               # fleet label stamped into the contract
#   endpoint: null               # this region's reachable base URL, e.g.
#                                # http://my-region:8765 (router pulls GET /contract)
#   webhook_timeout_seconds: 5.0
#
# When synapse.publish is true, each successful indexing sync (re)writes
# <state>/contract.latest.json (served at GET /contract and the MCP resource
# pheasant://knowledge-bases/{kb_id}/contract) and appends a sync.completed
# record to <state>/events/YYYY-MM-DD.ndjson. When router_url is also set, the
# event (with the inline contract) is POSTed to <router_url>/v1/synapse/events;
# webhook failures are logged, never raised.

# Grounded chat over your index (the UI's chat layer). Query-time only — no
# LLM ever runs during indexing, so re-syncing unchanged content stays
# Agent memory. Records are append-only Markdown files written by agents
# (MCP `memory_write` / `POST /memory`) into a `type: memory` source and
# indexed by the ordinary pipeline — recall is just search, there is no second
# retrieval path. This block controls consolidation, how memory takes part in
# retrieval, and how the store is bounded.
#
# A *corrected* record is dropped from results at query time, without waiting
# for consolidation; pass `{"current_only": false}` or an `as_of` instant on a
# search to see it again.
memory:
  # Archive superseded and TTL-expired records on the scheduler beat. The file
  # is renamed `<id>.md.archived` in place — bytes preserved, never deleted.
  consolidation_enabled: true
  # Per-scope age limits. null = that scope never expires by age.
  session_ttl_days: null
  user_ttl_days: null
  org_ttl_days: null
  # Days a superseded/TTL-expired record stays indexed (hidden from default
  # results, reachable via `as_of`/`current_only: false`) before it is
  # actually archived. 0 = archive immediately, the pre-Phase-2 default.
  # Opt in for point-in-time recall; it measurably costs ranking (see
  # docs/memory-system.md) since a corrected record's near-duplicate text
  # stays indexed alongside its correction.
  supersede_retention_days: 0
  # How memory takes part in a search that does not say. A per-call `memory`
  # argument always wins over this. auto | off | only | prefer
  default_policy: auto
  # Let `alias`/`preference`/`exclusion` records re-rank results, not merely be
  # retrievable. Off by default: a memory that silently re-orders searches is a
  # surprise unless it was asked for.
  steering_enabled: false
  # Count which records retrieval returns, so salience reflects use. Off by
  # default — a write on the read path, and an operator's decision to make.
  usage_tracking: false
  # Archive the least salient records past this many. null = unbounded. Runs
  # as a backstop after the per-scope/per-subject caps below.
  max_records: null
  # Per-scope caps, mirroring the *_ttl_days trio above — each scope its own
  # isolated pool, so a session flood cannot use its share of max_records to
  # crowd out an org fact (max_records alone only ever *outranks* it by
  # scope_weight, never fully protects it). null = that scope unbounded.
  session_max_records: null
  user_max_records: null
  org_max_records: null
  # Cap on live records sharing one `subject`, across scopes. Records with no
  # subject are exempt. null = unbounded.
  max_records_per_subject: null
  # Cap on `about` graph edges drawn per record by the memory bridge.
  about_max_targets: 3
  # Fold a write into an existing record (bump observations/last_seen)
  # instead of creating a new file when its normalized text already matches
  # one in the same scope/subject/kind/ACL bucket — exact repeat or
  # paraphrase alike. On by default, unlike usage_tracking above: this
  # records what was written, not what was looked up.
  reinforcement_enabled: true
  # Offline near-duplicate clustering + medoid promotion on the
  # consolidation pass. Off by default: unlike reinforcement, this changes
  # what a *default* query returns (a subsumed near-duplicate stops
  # appearing in results, though it stays indexed and reachable via an
  # explicit tier filter or current_only: false).
  compaction_enabled: false
  compaction_similarity_threshold: 0.6
  compaction_min_cluster_size: 2
  # L3: LLM-merge for what deterministic clustering cannot resolve
  # (complementary partial facts, progressive refinement, abstraction).
  # Opt-in AND never automatic — only the explicit memory_synthesize tool /
  # POST /memory/synthesize runs it, never the scheduler beat. Mirrors
  # assistant.* field for field.
  synthesis:
    enabled: false
    provider: auto            # auto | anthropic | openai | gemini | none
    model: null
    max_calls_per_pass: 20
    max_input_chars: 6000
    min_cluster_size: 3
    # Above this mean pairwise similarity a cluster is skipped: near-
    # identical rephrasings are what medoid promotion already resolves
    # losslessly, so model spend goes only where L1/L2 provably cannot
    # help (complementary partials, progressive refinement, abstraction).
    max_jaccard: 0.55

  # Turning observed interactions into memory. Off; nothing is read and no
  # candidate is minted until it is on. See docs/memory-formation.md.
  formation:
    enabled: false
    # One record per session, refined by superseding itself. Written directly
    # rather than proposed, and only because of scope: it is session-scoped
    # and written_by its own principal, so it never becomes shared knowledge.
    session_digest: true
    # Admit a proposal without review. Off for the same reason
    # compaction_enabled is: it changes what a *default* query returns.
    auto_admit: false
    min_observations: 3
    # ...and across this many distinct sessions. One session repeating itself
    # is a habit; several agreeing is a signal.
    min_sessions: 2
    max_candidates_per_pass: 50
    # A pending proposal nobody acted on expires. A rejection never does.
    candidate_ttl_days: 30
    rules:
      - session-digest-v1
      - alias-cooccurrence-v1
      - path-affinity-v1
      - retrieval-gap-v1

# Tracing, and the observation plane memory formation reads.
#
# Both off. Turning interactions on means the region records queries and
# principals -- an operator's decision, never a default.
#
# The boundary that makes it safe: an observation is a ROW with a retention
# policy. Never a file, never chunked, never indexed, never returned by a
# search. A UI session's chat does not become knowledge because it was
# observed; only an explicit admission writes a memory record, and it goes
# through the ordinary write path. See docs/memory-formation.md.
observability:
  # OTLP collector endpoint. null attaches no exporter at all -- spans are
  # still created and still feed the ledger, they just do not leave the box.
  # Exporting needs the [otel] extra.
  otlp_endpoint: null
  otlp_protocol: http/protobuf
  # The NAME of the env var holding `key=value,key=value` exporter headers,
  # never the value -- same rule as storage.dsn_env.
  otlp_headers_env: PHEASANT_OTLP_HEADERS
  service_name: pheasant
  # Head sampling for EXPORTED spans only. It deliberately does not thin the
  # ledger: sampling out a span your collector does not need should not also
  # cost the region a data point formation counts on.
  sample_ratio: 1.0
  interactions:
    enabled: false
    # Record no free text at all -- neither the question nor the answer.
    # Named for what it does rather than one of the two fields it covers:
    # redacting the question while keeping an answer that quotes the corpus
    # back at it would be incoherent. Identity, modality, criteria, result ids
    # and result paths survive, so the structural formation rules still work;
    # only the lexical one goes quiet.
    redact_text: false
    # Cap on a recorded assistant answer, in characters. 0 records no answers
    # at all -- the same "0 means off" shape hot_retention_days uses. A cap
    # because an answer is model output at 10-50x a question's bytes, and
    # unbounded it would let chat dominate a ledger sized for search.
    max_answer_chars: 4000
    # A backpressure knob, not a throughput one. The buffer is bounded and
    # overflow drops the OLDEST event rather than blocking a request: a log
    # tier falling behind must degrade to data loss, never to request latency.
    buffer_size: 10000
    flush_interval_seconds: 5.0
    # Events per published batch. Batching is what keeps the ledger off the
    # request path: one publish per N events, not one write per request.
    flush_batch_size: 500
    # Stop publishing (and start dropping, counted separately) past this
    # depth. Without it a stalled log tier turns a bounded memory buffer into
    # an unbounded table.
    max_queue_depth: 50000
    # How long events stay queryable in /state.
    # 0 = COLD-ONLY: batches go straight to Parquet and /state never grows.
    hot_retention_days: 7
    # Roll expired rows to <exports_path>/interactions/dt=YYYY-MM-DD/ before
    # deleting them. A Parquet directory enforces nothing and these rows carry
    # principals and query text -- put the access control on the directory.
    cold_enabled: false
    cold_retention_days: null  # null = keep cold partitions forever
    # Upper bound on rows one roll pass moves. Load-bearing in one container,
    # where the roll runs on the scheduler beat under the sync lock.
    max_rows_per_pass: 50000
    # Where a replica spools when /state is read-only and no queue is set --
    # the degraded path for a custom SQLite multi-process deployment. The
    # shipped fleet runs Postgres, so every replica writes directly.
    spool_path: null
    queue:
      # Off, whoever observed a call writes it. On, batches go to their OWN
      # queue (log_tasks, never index_tasks) and a `serve --role logger`
      # drains them -- so persistence, rolling and cold compaction never touch
      # a request or the indexer's sync lock. Worth it in a fleet; pure
      # overhead in one container.
      enabled: false
      backend: local  # local | nats
      visibility_seconds: 120
      # Below the index queue's 3 on purpose: a batch is best-effort, and
      # retrying a poisoned one three times costs more than the data.
      max_attempts: 2
      nats_stream: PHEASANT_LOGS
      nats_subject: pheasant.logs.batches
      nats_durable: pheasant-loggers

# byte-for-byte deterministic.
#
# With no provider reachable the assistant still answers, extractively: the
# top retrieved passages with their citations and graph facts. Point it at a
# model to get those passages synthesized into prose.
assistant:
  enabled: true
  # auto | anthropic | openai | gemini | none
  # "auto" picks the first provider whose key env var is set on the container
  # (ANTHROPIC_API_KEY, then OPENAI_API_KEY, then GEMINI_API_KEY).
  provider: auto
  # model: claude-sonnet-5      # provider default when unset
  # base_url: https://api.anthropic.com
  # api_key_env: ANTHROPIC_API_KEY   # env var NAME; the key never lands in config
  # Let a UI user paste their own key for the life of a browser session. It is
  # held in the server's memory behind an opaque token — never written to this
  # file, to /state, or to logs — and dropped on expiry, revoke or restart.
  allow_session_keys: true
  session_key_ttl_minutes: 720
  max_context_chunks: 8
  max_output_tokens: 4096
  request_timeout_seconds: 90.0
  max_facts: 12
  # Which agent workflow answers a question.
  #   auto     — "agentic" when a model is connected AND the [agent] extra is
  #              installed, otherwise "simple". Never fails closed.
  #   agentic  — LangGraph: plan → retrieve (multi-mode) → expand over the
  #              graph → grade the evidence → synthesize → verify citations,
  #              looping back to re-plan while the evidence is thin.
  #   simple   — one retrieval pass, one synthesis call.
  # Register your own under the `pheasant.agent_workflows` entry-point group
  # and name it here; see docs/how-to/agent-workflows.md.
  workflow: auto
  # Per-workflow tuning, merged over the workflow's defaults. Callers can
  # override any of these per request (`options` on POST /assistant/chat and
  # on the MCP tool `ask_knowledge_base`).
  workflow_options: {}
  #  agentic:
  #    max_rounds: 2
  #    retrieval_modes: [hybrid, vector]
  #    expand_graph: true
  #    max_context_passages: 10

# Knowledge-effectiveness evaluation (optional, off by default, read-only).
#
# Replays cohorts of recorded queries through the *real* search path against a
# corpus-only baseline and the memory system, then reports what changed with
# the evidence and the denominator attached. It publishes no single "accuracy"
# score — what comes out is a health vector plus hard gates for ACL leakage,
# stale-fact leakage and temporal correctness.
#
# Everything it writes lands in the `evaluation_*` tables and is never indexed,
# never chunked and never returned by a search: a region must not retrieve its
# own measurements as knowledge.
#
# Needs `observability.interactions.enabled` above to have queries worth
# replaying. Without it the cohorts are empty and every demonstrated metric
# reports `insufficient_evidence` rather than zero.
#
# Fleet-safe: a run claims the `__evaluation__` lease (so N API replicas
# produce one run, not N) and never runs inside the scheduler's sync lock.
#
# See docs/knowledge-effectiveness.md.
evaluation:
  enabled: false
  # Fire on the scheduler beat when the snapshot manifest shows a material
  # change. Off: a run costs one search per query per variant, which is real
  # work to start doing on a timer without being asked.
  on_material_snapshot: false
  minimum_interval_seconds: 3600
  max_results: 10
  mode: hybrid
  maximum_queries_per_run: 500
  maximum_runtime_seconds: 900
  maximum_stored_per_query_results: 200
  # How long a running batch may go without a heartbeat before another process
  # marks it `interrupted`. A knob because the right value depends on how long
  # one (cohort, variant) replay takes here. Too low reclaims a slow-but-healthy
  # batch out from under itself; too high shows a spinner for a stopped
  # container longer than it needs to. Reclamation runs at API boot and on the
  # scheduler beat, and a reclaimed run *resumes* from its checkpoints.
  run_stale_seconds: 90.0
  retrieval_diagnostics: false
  binary_preference: false
  # Empty means no composite is published at all — the specification's
  # "no default universal accuracy score". Configured, it is a weighted
  # geometric mean that excludes (never zero-fills) missing components.
  composite_weights: {}
  proof:
    # The three defaults that decide what every metric below *means*.
    #   unknown_is_negative: on, precision improves whenever the region
    #     returns FEWER results — it counts what was never shown as a failure.
    #   non_selection_is_negative: the reader may have found the answer at
    #     rank one and stopped. Silence is not evidence.
    #   temporal_decay_enabled: nobody should discover that a year-old
    #     conclusive test result quietly stopped counting.
    unknown_is_negative: false
    non_selection_is_negative: false
    temporal_decay_enabled: false
    temporal_half_life_days: 180.0
    # Net weight below which a target is neither a known positive nor a known
    # negative. Not zero: one weak citation is not a "known positive".
    positive_floor: 0.2
    minimum_eligible_queries: 10
    minimum_evidenced_queries: 5
    minimum_independent_interactions: 5
    maximum_single_query_proof_share: 0.5
  cohorts:
    anchor: true
    anchor_minimum_queries: 20
    rolling: true
    rolling_lookback_days: 30
    learned: true
    temporal_holdout: true
    # How long a holdout must stay independent is an open policy decision;
    # a hidden non-zero default would be answering it on your behalf.
    holdout_minimum_separation_days: 0.0
    holdout_minimum_queries: 5
    control: true
    control_minimum_queries: 10
    synthetic_invariants: true
    maximum_queries_per_cohort: 200
  # The ablation matrix. B0 (corpus baseline) is not listed because it is not
  # optional: every attribution number is a paired difference against it.
  variants:
    memory_content: true       # B1
    alias_only: true           # B2
    preference_only: true      # B3
    exclusion_only: true       # B4
    full_memory: true          # B5
    candidate_shadow: true     # B6
    leave_one_memory_out: false
    leave_one_cluster_out: false
  # Evaluated BEFORE any aggregation, so a failure cannot be averaged away.
  gates:
    acl_leak_maximum: 0
    stale_current_leak_maximum: 0
    temporal_invariant_failures_maximum: 0
    known_positive_exclusion_maximum: 0
    abstention_failures_maximum: 0
    control_regression_tolerance: 0.0
    negative_exposure_increase_tolerance: 0.0
    incomplete_snapshot_blocks_run: true
  promotion:
    # Off: the same decisions are computed and recorded and nothing is
    # applied. Read a month of them before letting any take effect.
    enabled: false
    require_shadow_replay: true
    require_all_hard_gates: true
    minimum_independent_queries: 3
    minimum_temporal_holdout_queries: 1
    minimum_target_metric_gain: 0.0
    maximum_control_regression: 0.0
    maximum_negative_exposure_increase: 0.0
    # The anti-self-reward rule. A candidate that improves only the query that
    # created it has demonstrated recall of its own evidence and nothing else.
    allow_originating_query_only_promotion: false
    insufficient_evidence_action: retain_candidate

sources:
  - name: pheasant-repo
    type: repository
    path: /workspace
    description: pheasant repository mounted from the cloned repo root
    enabled: true
    include:
      - "**/*.py"
      - "**/*.md"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.toml"
      - "**/Dockerfile"
    exclude:
      - "**/.git/**"
      - "**/.env"
      - "**/.env.*"
      - "**/*id_rsa*"
      - "**/*id_ed25519*"
      - "**/*.pem"
      - "**/*.key"
      - "**/__pycache__/**"
      - "**/.venv/**"
      - "**/.pheasant/**"
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "docs/**"
      - "exports/**"
      - "state/**"
      - "workspace/**"
    repo:
      branch_policy: current
      include_uncommitted: true
      commit_trigger: true
      # Set automatically by URL quick-add; null keeps this a local checkout.
      clone_url: null
      clone_path: null
      clone_ref: null
      dependency_graph:
        enabled: true
        languages:
          python: true
          javascript: false
          typescript: false
    chunking:
      enabled: true
      strategy: semantic
      max_chars: 4000
      overlap_chars: 400
    sync:
      on_startup: true
      on_file_change: debounce
      on_git_commit: true
      interval_seconds: 900

  - name: existing-obsidian-vault
    type: obsidian_vault
    path: /workspace/my-vault
    description: Optional existing Obsidian vault to index as a source
    enabled: false
    include:
      - "**/*.md"
      - "**/*.canvas"
    exclude:
      - "**/.obsidian/**"
      - "**/.trash/**"
    sync:
      on_startup: true
      on_file_change: debounce

  - name: pheasant-docs
    type: document_folder
    path: /workspace/docs
    description: pheasant documentation folder from the cloned repo root
    enabled: true
    include:
      - "**/*.pdf"
      - "**/*.docx"
      - "**/*.txt"
      - "**/*.md"
      - "**/*.html"
      - "**/*.xml"
    exclude:
      - "**/~$*"
      - "**/.git/**"
      - "**/.env*"
      - "**/*.pem"
      - "**/*.key"
    chunking:
      enabled: true
      strategy: heading_or_page
      max_chars: 5000
      overlap_chars: 500
    # Structural taxonomy extraction, for books / procedures / standards /
    # contracts: detect the outline the document already declares (Chapter,
    # Article, Section, § 12.3, 1.2.3, (a)) and use it as retrieval structure.
    # Chunks become sections labelled with their breadcrumb (`heading_path`,
    # which FTS weights at 2.0 — double the body text), `heading` graph nodes
    # + `has_heading` edges are emitted, and GET /taxonomy renders the tree.
    #
    # OFF by default and deliberately per-source: `1. Introduction` in a
    # standard is a section while `1. Buy milk` in a note is a list item, and
    # nothing in the line tells them apart. Enabling it is how you say "this
    # source really is structured documentation". It changes this source's FTS
    # content and chunk boundaries, so re-sync with --mode full after turning
    # it on. Set it at registration (POST /sources, quick-add, MCP) too.
    taxonomy:
      enabled: false
      max_depth: 6          # deepest heading level kept (1-6)
      detect: []            # [] = all rules; narrow with any of:
                            #   markdown | keyword | code | numbered
                            #   | lettered | caps   (caps is the noisiest)
      graph_nodes: true     # emit `heading` nodes + `has_heading` edges
      split_on_sections: true   # one chunk per section (still split when a
                            #   section exceeds chunking.max_chars)
    sync:
      on_startup: true
      on_file_change: debounce
      interval_seconds: 3600
