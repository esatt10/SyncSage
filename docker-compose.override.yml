services:
  pheasant:
    environment:
      # Compose reads the value from the gitignored root .env and forwards it
      # to embeddings and the assistant without putting it in this file.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # The source is explicitly configured at /data. Do not also auto-add
      # the repository bind-mounted at /workspace by the image entrypoint.
      PHEASANT_WORKSPACE: /do-not-auto-index
    volumes:
      - ./pheasant.yaml:/config/pheasant.yaml:rw
      - "${PHEASANT_DATA_PATH}:/data:ro"
