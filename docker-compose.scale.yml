# The role-split fleet, in Compose.
#
#   docker compose -f docker-compose.scale.yml up -d --scale worker=4
#
# `docker-compose.yml` (one container, role `all`) remains the default and
# needs no infrastructure. This file is the other trade: Postgres, a shared
# state volume, and three tiers that scale independently. It is worth it past
# the point where one container stops being enough — see
# docs/how-to/capacity-planning.md — and not before.
#
# The three tiers and why they are separate:
#
#   api      serves search/UI/MCP, never indexes; publishes index work
#   indexer  ONE replica: watches, schedules, drains the queue
#   worker   parse/chunk only — the tier you scale, with --scale worker=N
#
# Only `worker` is safe to scale here: `api` would need a load balancer in
# front of it (Compose has none), and a second `indexer` would spend its life
# losing lease races.
name: pheasant-fleet

x-fleet-env: &fleet-env
  PHEASANT_CONFIG: /config/pheasant.yaml
  PHEASANT_DATABASE_URL: postgresql://pheasant:${POSTGRES_PASSWORD:?set a postgres password}@postgres:5432/pheasant
  PHEASANT_INDEX_WORKER_TOKEN: ${PHEASANT_INDEX_WORKER_TOKEN:?set a shared worker token}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pheasant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a postgres password}
      POSTGRES_DB: pheasant
    volumes:
      - pheasant-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pheasant"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${PHEASANT_IMAGE:-ghcr.io/esatt10/pheasant:0.10.4}
    build:
      context: .
    restart: unless-stopped
    command: ["serve", "--role", "api"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only. The API is unauthenticated and can be pointed at any
      # mounted path, and Docker's iptables rules bypass most host firewalls.
      - "${PHEASANT_BIND:-127.0.0.1}:${PHEASANT_PORT:-8765}:8765"
    environment: *fleet-env
    volumes:
      - ./deploy/compose/fleet.yaml:/config/pheasant.yaml:ro
      # Read-only: the indexer is the only writer of /state. The api replica
      # polls the graph file and reloads it when the indexer rewrites it.
      - pheasant-state:/state:ro
      - ${PHEASANT_WORKSPACE_PATH:-.}:/workspace:ro
      # The Parquet extract, and the one volume meant to be read by
      # something that is not pheasant. Swap the named volume for a host
      # path to hand it straight to an outside service:
      #   - ${PHEASANT_EXPORTS_PATH:-./exports}:/exports
      - pheasant-exports:/exports
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  indexer:
    image: ${PHEASANT_IMAGE:-ghcr.io/esatt10/pheasant:0.10.4}
    build:
      context: .
    restart: unless-stopped
    command: ["serve", "--role", "indexer"]
    # Not scalable, and Compose will happily let you try: `--scale indexer=2`
    # gives two processes taking turns on one lease, not twice the throughput.
    scale: 1
    depends_on:
      postgres:
        condition: service_healthy
    environment: *fleet-env
    volumes:
      - ./deploy/compose/fleet.yaml:/config/pheasant.yaml:ro
      - pheasant-state:/state
      - ${PHEASANT_WORKSPACE_PATH:-.}:/workspace:ro
      - pheasant-exports:/exports
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    image: ${PHEASANT_IMAGE:-ghcr.io/esatt10/pheasant:0.10.4}
    build:
      context: .
    restart: unless-stopped
    command: ["serve", "--role", "worker"]
    # No ports: reached only by the indexer, over the Compose network, by
    # service name. Compose round-robins DNS across the scaled replicas, and
    # the coordinator's circuit breakers take a dead one out of rotation.
    environment:
      PHEASANT_CONFIG: /config/pheasant.yaml
      # The only secret a worker gets — deliberately not the database URL.
      PHEASANT_INDEX_WORKER_TOKEN: ${PHEASANT_INDEX_WORKER_TOKEN:?set a shared worker token}
    volumes:
      - ./deploy/compose/worker.yaml:/config/pheasant.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  pheasant-state:
  pheasant-exports:
  pheasant-pg:
