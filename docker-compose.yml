services:
  syncsage:
    image: ${SYNCSAGE_IMAGE:-ghcr.io/esatt10/syncsage:0.1.1}
    container_name: syncsage
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      SYNCSAGE_CONFIG: /config/syncsage.yaml
    volumes:
      - ${SYNCSAGE_CONFIG_PATH:-./syncsage.example.yaml}:/config/syncsage.yaml:ro
      - ${SYNCSAGE_WORKSPACE_PATH:-./workspace}:/workspace:ro
      - ${SYNCSAGE_VAULT_PATH:-./vault}:/vault
      - syncsage-state:/state
      - syncsage-exports:/exports
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  syncsage-state:
  syncsage-exports:
