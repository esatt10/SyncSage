services:
  syncsage:
    build:
      context: .
    image: ${SYNCSAGE_IMAGE:-ghcr.io/esatt10/syncsage:0.4.0}
    container_name: syncsage
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      SYNCSAGE_CONFIG: /config/syncsage.yaml
    volumes:
      - ${SYNCSAGE_CONFIG_PATH:-./syncsage.example.yaml}:/config/syncsage.yaml:ro
      # The example config's only source is `path: /workspace`, so whatever is
      # mounted here IS the demo corpus. It defaults to the repository root —
      # mounting an empty ./workspace instead indexes nothing, and the UI then
      # shows a single knowledge-base node with no graph around it.
      - ${SYNCSAGE_WORKSPACE_PATH:-.}:/workspace:ro
      # Local files that live OUTSIDE ./workspace: point SYNCSAGE_DATA_PATH at
      # any host directory and it appears in the container at /data (an allowed
      # source root). This is how you index files that aren't a subdirectory of
      # the workspace. Add more mounts here (or in docker-compose.override.yml)
      # the same way, then add each container path to security.allow_workspace_roots.
      - ${SYNCSAGE_DATA_PATH:-./data}:/data:ro
      - ${SYNCSAGE_VAULT_PATH:-./vault}:/vault
      - syncsage-state:/state
      - syncsage-exports:/exports
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional web UI. A separate workload that serves the static React bundle and
  # proxies /api/* to the syncsage service above. Bring it up with
  # `docker compose up --build`; omit it to run SyncSage headless.
  syncsage-ui:
    build:
      context: ./ui
    image: ${SYNCSAGE_UI_IMAGE:-ghcr.io/esatt10/syncsage-ui:0.1.12}
    container_name: syncsage-ui
    restart: unless-stopped
    ports:
      - "${SYNCSAGE_UI_PORT:-8080}:80"
    depends_on:
      syncsage:
        condition: service_healthy

volumes:
  syncsage-state:
  syncsage-exports:
