name: pheasant-kb

x-pheasant-environment: &pheasant-environment
  PHEASANT_CONFIG: /config/pheasant.yaml
  PHEASANT_DATABASE_URL: postgresql://pheasant@postgres:5432/pheasant
  PHEASANT_INDEX_WORKER_TOKEN: ${PHEASANT_INDEX_WORKER_TOKEN:-local-pheasant-worker-token}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GH_TOKEN: ${GH_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pheasant
      POSTGRES_USER: pheasant
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pheasant -d pheasant"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pheasant-postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M

  repo-bootstrap:
    image: pheasant-local:docker
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        clone() {
          name="$$1"
          url="$$2"
          if [ -d "/workspace/$$name/.git" ]; then
            echo "$$name already present"
          else
            rm -rf "/workspace/$$name"
            git clone --depth 1 --filter=blob:none "$$url" "/workspace/$$name"
          fi
        }
        clone langchain https://github.com/langchain-ai/langchain.git
        clone langgraph https://github.com/langchain-ai/langgraph.git
        clone deepagents https://github.com/langchain-ai/deepagents.git
        clone openwiki https://github.com/langchain-ai/openwiki.git
        chown -R 10001:10001 /workspace
        echo "repository bootstrap complete"
    volumes:
      - pheasant-repositories:/workspace
    restart: "no"

  db-init:
    image: pheasant-local:docker
    restart: "no"
    entrypoint: ["python", "-c"]
    command:
      - "from pathlib import Path; from pheasant.cli import _engine; engine = _engine(Path('/config/pheasant.yaml')); engine.close()"
    environment: *pheasant-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pheasant.yaml:/config/pheasant.yaml:ro

  pheasant-worker:
    image: pheasant-local:docker
    restart: unless-stopped
    entrypoint: ["python", "-m", "pheasant"]
    command: ["serve", "--config", "/config/pheasant.yaml", "--role", "worker"]
    environment: *pheasant-environment
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./pheasant.yaml:/config/pheasant.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  pheasant:
    build:
      context: .
      args:
        PHEASANT_EXTRAS: mcp,agent,vector,wasm,a2a,postgres,grpc,queue,analytics
    image: pheasant-local:docker
    restart: unless-stopped
    entrypoint: ["python", "-m", "pheasant"]
    command: ["serve", "--config", "/config/pheasant.yaml", "--role", "all"]
    environment: *pheasant-environment
    depends_on:
      db-init:
        condition: service_completed_successfully
      repo-bootstrap:
        condition: service_completed_successfully
      pheasant-worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PHEASANT_PORT:-8765}:8765"
    volumes:
      - ./pheasant.yaml:/config/pheasant.yaml:ro
      # URL-backed repositories are managed checkouts: the coordinator must
      # fetch and fast-forward them before indexing. Workers receive content
      # over HTTP and still do not mount this volume.
      - pheasant-repositories:/workspace
      - pheasant-state:/state
      - pheasant-memory:/memory
      - pheasant-exports:/exports
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

volumes:
  pheasant-postgres:
  pheasant-repositories:
  pheasant-state:
  pheasant-memory:
  pheasant-exports:
