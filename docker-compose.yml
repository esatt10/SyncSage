# One service. The pheasant image serves the API, the MCP server and the web
# UI from the same container on the same port, so there is nothing to wire up
# between them — no sidecar, no nginx, no second published port, no CORS origin
# to get right.
#
#   docker compose up -d              # everything, at http://localhost:8765
#   docker compose up -d --build      # rebuild from this checkout
#
# The optional `pheasant-ui` sidecar below is for deployments that want to
# serve or cache the static bundle separately; it is off unless you ask for it:
#
#   docker compose --profile ui up -d
services:
  pheasant:
    build:
      context: .
    image: ${PHEASANT_IMAGE:-ghcr.io/esatt10/pheasant:0.10.3}
    container_name: pheasant
    restart: unless-stopped
    ports:
      # Published to loopback only. The API is unauthenticated and can be
      # pointed at any path mounted into the container, so a bare "8765:8765"
      # would expose it to every host on the network — and Docker's own
      # iptables rules bypass most host firewalls, so this is not something
      # the machine's firewall would have caught. Set PHEASANT_BIND=0.0.0.0
      # only behind an authenticating ingress.
      - "${PHEASANT_BIND:-127.0.0.1}:${PHEASANT_PORT:-8765}:8765"
    environment:
      PHEASANT_CONFIG: /config/pheasant.yaml
    volumes:
      # No config file? Leave this commented out and the entrypoint generates
      # one on first boot from the same defaults `pheasant setup` uses.
      # Keep this writable: settings changed in the web UI are persisted here.
      # - ${PHEASANT_CONFIG_PATH:-./pheasant.yaml}:/config/pheasant.yaml:rw
      - pheasant-config:/config
      # Whatever is mounted here is the corpus. Defaults to the repository
      # root; point it anywhere with PHEASANT_WORKSPACE_PATH.
      - ${PHEASANT_WORKSPACE_PATH:-.}:/workspace:ro
      # Local files that live OUTSIDE the workspace: point PHEASANT_DATA_PATH
      # at any host directory and it appears in the container at /data (an
      # allowed source root). `pheasant mount <hostpath>` writes further
      # mounts into docker-compose.override.yml for you, and the UI tells you
      # the exact line to add when you paste a path it cannot see.
      - ${PHEASANT_DATA_PATH:-./data}:/data:ro
      - pheasant-state:/state
      # The Parquet extract, and the one volume meant to be read by
      # something that is not pheasant. Swap the named volume for a host
      # path to hand it straight to an outside service:
      #   - ${PHEASANT_EXPORTS_PATH:-./exports}:/exports
      - pheasant-exports:/exports
    # Sized for a busy process, not just a dead one. /health returns a constant
    # dict, but pheasant answers from a single Python process: while a heavy
    # agentic question or a graph walk holds the GIL, even that trivial handler
    # waits its turn. A tight budget here does not detect a problem, it invents
    # one — the container flips to unhealthy under exactly the load it is
    # meant to be serving.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Optional: the static bundle served by its own nginx, proxying /api/* to the
  # service above. The main image already serves the UI, so this exists only
  # for deployments that want the front end scaled or cached independently.
  # Enable with: docker compose --profile ui up -d
  pheasant-ui:
    profiles: ["ui"]
    build:
      context: ./ui
    image: ${PHEASANT_UI_IMAGE:-ghcr.io/esatt10/pheasant-ui:0.10.3}
    container_name: pheasant-ui
    restart: unless-stopped
    ports:
      - "${PHEASANT_BIND:-127.0.0.1}:${PHEASANT_UI_PORT:-8080}:80"
    depends_on:
      pheasant:
        condition: service_healthy

volumes:
  pheasant-state:
  pheasant-exports:
  pheasant-config:
