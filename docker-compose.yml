services:
  syncsage:
    image: ghcr.io/esatt10/syncsage:latest
    container_name: syncsage
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      SYNCSAGE_CONFIG: /config/syncsage.yaml
    volumes:
      - ./syncsage.yaml:/config/syncsage.yaml:ro
      - ~/projects:/workspace:ro
      - ~/SyncSageVault:/vault
      - syncsage-state:/state
      - syncsage-exports:/exports
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  syncsage-state:
  syncsage-exports:
