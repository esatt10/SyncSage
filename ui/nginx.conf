server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS so upstream IPs are re-resolved at request time
    # rather than cached at nginx startup.
    resolver 127.0.0.11 valid=10s;

    # Proxy API calls to the pheasant container (compose service name `pheasant`).
    # With a variable upstream, proxy_pass cannot include a URI suffix without
    # replacing every request path, so rewrite /api/graph -> /graph first.
    location /api/ {
        set $pheasant_upstream http://pheasant:8765;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $pheasant_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        # Keep large graph responses in memory to avoid buffering to disk.
        proxy_buffers 32 256k;
        proxy_buffer_size 256k;
        proxy_busy_buffers_size 512k;
        # Server-sent events (the chat progress stream) must reach the browser
        # as they happen. nginx buffers proxied responses by default, which
        # would hold every step until the answer was already finished; the app
        # sends `X-Accel-Buffering: no` and this honours it. HTTP/1.1 keeps the
        # connection streaming rather than closing per chunk.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # SPA fallback so client-side routes (e.g. /sources, /config) resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
