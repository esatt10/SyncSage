server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS so upstream IPs are re-resolved at request time
    # rather than cached at nginx startup.
    resolver 127.0.0.11 valid=10s;

    # Proxy API calls to the SyncSage container (compose service name `syncsage`).
    # The trailing slash strips the /api prefix: /api/graph -> /graph.
    location /api/ {
        set $syncsage_upstream http://syncsage:8765;
        proxy_pass $syncsage_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        # Keep large graph responses in memory to avoid buffering to disk.
        proxy_buffers 32 256k;
        proxy_buffer_size 256k;
        proxy_busy_buffers_size 512k;
    }

    # SPA fallback so client-side routes (e.g. /sources, /config) resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
