server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the SyncSage container (compose service name `syncsage`).
    # The trailing slash strips the /api prefix: /api/graph -> /graph.
    location /api/ {
        proxy_pass http://syncsage:8765/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # SPA fallback so client-side routes (e.g. /sources, /config) resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
