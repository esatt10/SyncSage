[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syncsage"
version = "0.3.2"
description = "Docker-first MCP knowledge graph indexer and agentic retrieval layer"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SyncSage Contributors" }]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "networkx>=3.3",
  "typer>=0.12",
  "watchdog>=4.0",
  "markdown-it-py>=3.0",
  "beautifulsoup4>=4.12",
  "python-docx>=1.1",
  "pymupdf>=1.24",
  "numpy>=1.26",
  "zstandard>=0.22",
]

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
vector = ["lancedb>=0.6"]
# Synapse 24.4: optional Ed25519 contract signing. Gated so a region that
# never sets synapse.signing_key_ref needs no crypto dep and the offline
# suite passes without it.
a2a = ["cryptography>=42.0"]
# Documentation site (MkDocs Material). Build with: mkdocs build --strict
docs = ["mkdocs-material>=9.5"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[project.entry-points."syncsage.connectors"]
notion = "syncsage.connectors.notion:NotionConnector"

[project.scripts]
syncsage = "syncsage.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/syncsage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
