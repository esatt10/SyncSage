# The serving tier. Stateless, horizontally scalable, and it never indexes:
# a sync request here is published to the queue for the indexer to run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pheasant-api
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pheasant
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pheasant
        app.kubernetes.io/component: api
    spec:
      # 30s: comfortably more than the 15s drain configured in the ConfigMap,
      # so the pod finishes draining before the kubelet escalates to SIGKILL.
      # Raising drain_seconds without raising this kills pods mid-drain.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: pheasant
          image: ghcr.io/esatt10/pheasant:0.10.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--role", "api"]
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: PHEASANT_CONFIG
              value: /config/pheasant.yaml
            - name: PHEASANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pheasant-secrets
                  key: PHEASANT_DATABASE_URL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            # Read-only: an api replica reads the graph the indexer wrote and
            # must never write /state. Needs ReadWriteMany — see README.
            - name: state
              mountPath: /state
              readOnly: true
            - name: workspace
              mountPath: /workspace
              readOnly: true
            - name: exports
              mountPath: /exports
          # Liveness asks only "is this process gone", and slowly: pheasant
          # answers from one Python process, so a heavy question holds the GIL
          # and even /health waits its turn. A tight budget does not detect a
          # problem, it invents one.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          # Readiness is tighter here than on the single-container install,
          # because with replicas it does something useful: it takes ONE pod
          # out while the others serve. It is also how draining works — on
          # SIGTERM this starts failing 15s before the process stops.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              # Serving holds the graph in memory like any other role, so this
              # tracks the capacity-planning table, not the request rate.
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: pheasant-fleet-config
        - name: state
          persistentVolumeClaim:
            claimName: pheasant-state
        - name: workspace
          persistentVolumeClaim:
            claimName: pheasant-workspace
        - name: exports
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pheasant-api
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8765
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pheasant-api
  namespace: pheasant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pheasant-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Five minutes, because a new replica's first request is expensive: it
      # loads the whole graph into memory at startup. Scaling down eagerly and
      # back up buys nothing and pays that cost twice.
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pheasant-api
  namespace: pheasant
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pheasant
      app.kubernetes.io/component: api
