# EXAMPLE ONLY — do not apply as-is, and do not commit real values.
#
# Create it out of band instead:
#
#   kubectl -n pheasant create secret generic pheasant-secrets \
#     --from-literal=PHEASANT_DATABASE_URL='postgresql://user:pass@host:5432/pheasant' \
#     --from-literal=PHEASANT_API_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=PHEASANT_INDEX_WORKER_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=PHEASANT_GRAPH_SERVICE_TOKEN="$(openssl rand -hex 32)"
#
# One `openssl rand` per line, not one reused across them: these are separate
# trust boundaries, and the weakest holder of a shared value sets the strength
# of every boundary it spans. A serving process refuses to start when the
# graph and worker tokens resolve to the same value.
#
# The config never contains these values: it names their environment variables,
# and only those names appear in YAML.
apiVersion: v1
kind: Secret
metadata:
  name: pheasant-secrets
  namespace: pheasant
type: Opaque
stringData:
  PHEASANT_DATABASE_URL: postgresql://pheasant:CHANGE_ME@postgres:5432/pheasant
  # The region's front door: every request outside /health, /ready and
  # /metrics carries it as `Authorization: Bearer <value>`. Serving roles
  # refuse to start on a routable bind without it, unless the config declares
  # security.api_auth.behind_authenticating_proxy.
  PHEASANT_API_TOKEN: CHANGE_ME
  # The shared bearer token every coordinator and worker must agree on. It is
  # also the only secret the worker Deployment mounts.
  PHEASANT_INDEX_WORKER_TOKEN: CHANGE_ME
  # Internal only; shared by API/MCP clients and the graph-query service.
  # CHANGE_ME_TOO — a distinct value from the worker token above.
  PHEASANT_GRAPH_SERVICE_TOKEN: CHANGE_ME_TOO
