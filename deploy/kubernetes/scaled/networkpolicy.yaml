# Who may reach which tier (Phase 35.8).
#
# The bearer token on the API is authentication, not a perimeter, and two of
# the fleet's endpoints are not meant to be reachable by callers at all: the
# internal graph-query API serves the region's whole graph, and the preparation
# workers accept parse work. Both enforce their own bearer token — but a token
# check is the last line, not the only one, and a flat pod network means every
# workload in the cluster gets to try.
#
# So: default-deny ingress across the pheasant pods, then one allowance per
# real caller. L3/L4 is all a NetworkPolicy can express, which is exactly why
# the tiers are separate Deployments with separate Services — the path split
# the review asked for is already a workload split.
#
#   kubectl apply -f deploy/kubernetes/scaled/networkpolicy.yaml
#
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, Antrea, most
# managed clusters). On a CNI that ignores it, this file is inert and the
# tokens are the only control — check before relying on it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pheasant-default-deny-ingress
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
spec:
  # Every pheasant pod, whatever its component. The rules below add back the
  # traffic each tier actually needs; anything not named here is refused.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pheasant
  policyTypes:
    - Ingress
---
# The API tier is the only one anything outside the namespace may reach, and
# the only one an ingress controller should be pointed at.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pheasant-api-ingress
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pheasant
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Narrow this to your ingress controller's namespace in production —
        # `namespaceSelector: {matchLabels: {kubernetes.io/metadata.name:
        # ingress-nginx}}`. It is left open here because the controller's
        # namespace differs per cluster and a wrong label silently drops all
        # traffic to the region.
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8765
---
# The graph service answers /internal/graph/query, which returns nodes and
# edges from the resident snapshot. Only pheasant's own pods ever call it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pheasant-graph-ingress
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: graph
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pheasant
      app.kubernetes.io/component: graph
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pheasant
      ports:
        - protocol: TCP
          port: 8765
    - from:
        # The metrics scrape. Label your Prometheus namespace to match, or
        # delete this block and scrape through a sidecar.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8765
---
# Preparation workers are called by the indexer and by nothing else. They are
# also the tier most likely to be running somebody else's parse code, so this
# is the allowance worth being strict about.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pheasant-worker-ingress
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pheasant
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pheasant
              app.kubernetes.io/component: indexer
      ports:
        - protocol: TCP
          port: 8765
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8765
---
# The indexer and the log tier serve probes and /metrics and are called by
# nothing: their work arrives on the queue, not over HTTP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pheasant-internal-tiers-ingress
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["pheasant"]
      - key: app.kubernetes.io/component
        operator: In
        values: ["indexer", "logger"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8765
