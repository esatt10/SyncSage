# Prometheus Operator scrape config. Every role serves /metrics, and every
# role is worth scraping for a different reason:
#
#   api      — request latency, shed count, in-flight, draining
#   indexer  — queue depth, per-source throughput/ETA/stall, graph size
#   worker   — liveness for the coordinator's `pheasant_worker_up` view
#
# One ServiceMonitor per component, because their Services differ (the
# indexer's is headless) and because the labels are what make a dashboard
# able to say "which tier is unhappy".
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pheasant-api
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pheasant
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pheasant-indexer
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pheasant
      app.kubernetes.io/component: indexer
  endpoints:
    - port: http
      path: /metrics
      # Faster than the api tier: this is the endpoint the worker autoscaler
      # reads, and a 30s scrape plus a 30s poll is a minute of lag before a
      # backlog moves anything.
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pheasant-worker
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pheasant
      app.kubernetes.io/component: worker
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
