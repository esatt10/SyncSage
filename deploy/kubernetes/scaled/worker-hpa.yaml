# Scaling the preparation tier on the backlog rather than on CPU.
#
# CPU is a lagging signal here: workers are only busy once the indexer is
# already sending them work, so a CPU-driven HPA adds capacity after the queue
# has built up. `pheasant_index_queue_depth` is the leading one — it rises the
# moment sources are enqueued, before any parsing starts.
#
# Two forms below. Apply ONE.
---
# (a) KEDA. Preferred: it reads Prometheus directly, needs no custom-metrics
# API, and can scale to zero — which matters because an idle fleet's workers
# are pure cost.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pheasant-worker
  namespace: pheasant
spec:
  scaleTargetRef:
    name: pheasant-worker
  minReplicaCount: 0
  maxReplicaCount: 20
  # Long enough that a fleet does not flap between sources in one sync pass.
  cooldownPeriod: 300
  pollingInterval: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        # Sum across replicas: the depth is a per-knowledge-base number that
        # every pod reports identically, so max() would be right too — but
        # sum/count is robust to a pod that has not scraped yet.
        query: sum(pheasant_index_queue_depth) or vector(0)
        # One worker per two queued sources. Deliberately conservative: a
        # source is a long task, and over-provisioning workers does not make
        # a single source index faster — only several sources at once.
        threshold: "2"
---
# (b) Plain HPA, for a cluster without KEDA. Needs prometheus-adapter to
# expose `pheasant_index_queue_depth` as an external metric. Cannot scale to
# zero (HPA's minReplicas floor is 1).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pheasant-worker
  namespace: pheasant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pheasant-worker
  minReplicas: 1
  maxReplicas: 20
  metrics:
    - type: External
      external:
        metric:
          name: pheasant_index_queue_depth
        target:
          type: AverageValue
          averageValue: "2"
    # CPU as a floor, not the primary signal: it catches a fleet that is
    # saturated on files within one already-claimed source, which the queue
    # depth cannot see.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      # Workers are cheap and stateless; a backlog should be met quickly.
      stabilizationWindowSeconds: 30
    scaleDown:
      # But not shed quickly: a worker killed mid-batch costs the coordinator
      # a retry, and a sync's load is bursty by nature.
      stabilizationWindowSeconds: 300
