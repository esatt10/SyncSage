apiVersion: v1
kind: ConfigMap
metadata:
  name: syncsage-config
  namespace: syncsage
  labels:
    app.kubernetes.io/name: syncsage
data:
  syncsage.yaml: |
    syncsage:
      name: k8s-syncsage
      environment: kubernetes
      log_level: INFO
      state_path: /state
      vault_path: /vault
      workspace_root: /workspace
      exports_path: /exports
    server:
      host: 0.0.0.0
      port: 8765
      mcp:
        enabled: true
        transports:
          stdio: false
          streamable_http: true
          sse: false
      api:
        enabled: true
        openapi: true
      ui:
        enabled: true
        graph_visualization: true
    storage:
      sqlite_path: /state/syncsage.db
      graph_path: /state/graphs
      manifest_path: /state/manifests
      max_state_size_gb: 10
    search:
      default_mode: hybrid
      keyword:
        enabled: true
        engine: sqlite_fts5
    sync:
      startup:
        full_validation: true
        repair_missing_indexes: true
      watcher:
        enabled: true
        debounce_ms: 1500
      scheduler:
        enabled: true
        interval_seconds: 900
    obsidian:
      enabled: true
      note_root: SyncSage
      create_chunk_notes: false
    security:
      allow_workspace_roots:
        - /workspace
        - /vault
      read_only_sources: true
    sources: []
