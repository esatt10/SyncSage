apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pheasant-default
  namespace: pheasant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pheasant
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8765
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
