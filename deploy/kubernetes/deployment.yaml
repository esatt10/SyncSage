apiVersion: apps/v1
kind: Deployment
metadata:
  name: pheasant
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pheasant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pheasant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: pheasant
          image: ghcr.io/esatt10/pheasant:0.8.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: PHEASANT_CONFIG
              value: /config/pheasant.yaml
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: state
              mountPath: /state
            - name: vault
              mountPath: /vault
            - name: workspace
              mountPath: /workspace
              readOnly: true
            - name: exports
              mountPath: /exports
          # Probe budgets are sized for a BUSY process, not just a dead one.
          # pheasant answers from one Python process: a heavy agentic question
          # or a large graph walk holds the GIL for stretches, and /health —
          # which returns a constant dict — still has to wait its turn behind
          # that work. With the old budget (5s timeout, 3 failures, 30s period)
          # a genuinely healthy pod under load could be killed after ~90s of
          # slow replies, taking an in-flight sync with it. That is the probe
          # interfering with the workload it is supposed to be protecting.
          #
          # Liveness therefore only asks "is this process gone", and answers it
          # slowly: ~5 minutes of no response before a restart. A wedged
          # process is still caught; a working one is left alone.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          # Readiness gates Service endpoints. On a single-replica deployment
          # pulling the only pod out mid-question does not shed load, it just
          # 503s the user who is waiting — so this is forgiving too, and exists
          # to cover startup rather than to react to saturation.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: pheasant-config
        - name: state
          persistentVolumeClaim:
            claimName: pheasant-state
        - name: vault
          persistentVolumeClaim:
            claimName: pheasant-vault
        - name: workspace
          emptyDir: {}
        - name: exports
          emptyDir: {}
