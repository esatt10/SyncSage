apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pheasant-state
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# /exports: the Parquet extract. Separate from /state because it is the volume
# an outside reader mounts — a warehouse loader, an analytics job, a sync
# sidecar — and giving it its own claim means that reader never needs access to
# operational state. It was an `emptyDir`, so exports vanished on restart and
# nothing outside the pod could reach them at all.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pheasant-exports
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: exports
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
