# The role-split fleet, in Compose.
#
#   docker compose --env-file .env -f deploy/compose/docker-compose.scale.yml up -d \
#     --scale indexer=4 --scale worker=8
#
# `docker-compose.yml` (one container, role `all`) remains the default and
# needs no infrastructure. This file is the other trade: Postgres, NATS
# JetStream, a shared state volume, and three tiers that scale independently.
# It is worth it past
# the point where one container stops being enough — see
# docs/how-to/capacity-planning.md — and not before.
#
# The three tiers and why they are separate:
#
#   api      serves search/UI/MCP, never indexes; publishes index work
#   indexer  watches, schedules and drains the durable NATS queue
#   worker   parse/chunk only — the tier you scale, with --scale worker=N
#
# Scale indexers and workers together. PostgreSQL supplies per-source leases
# and JetStream distributes source tasks. API replicas still need an external
# load balancer, which Compose intentionally does not provide.
name: pheasant-fleet

x-fleet-env: &fleet-env
  PHEASANT_CONFIG: /config/pheasant.yaml
  PHEASANT_DATABASE_URL: postgresql://pheasant:${POSTGRES_PASSWORD:-pheasant}@postgres:5432/pheasant
  PHEASANT_INDEX_WORKER_TOKEN: ${PHEASANT_INDEX_WORKER_TOKEN:?set a shared worker token}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GH_TOKEN: ${GH_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=400"]
    environment:
      POSTGRES_USER: pheasant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pheasant}
      POSTGRES_DB: pheasant
    volumes:
      - pheasant-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pheasant"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - pheasant-nats:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    image: ${PHEASANT_IMAGE:-ghcr.io/esatt10/pheasant:0.10.3}
    restart: "no"
    entrypoint: ["python", "-c"]
    command:
      - "from pathlib import Path; from pheasant.cli import _engine; engine = _engine(Path('/config/pheasant.yaml')); engine.close()"
    environment: *fleet-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./fleet.yaml:/config/pheasant.yaml:ro
      - pheasant-state:/state
      - pheasant-exports:/exports

  api:
    image: ${PHEASANT_IMAGE:-ghcr.io/esatt10/pheasant:0.10.3}
    build:
      context: ../..
    restart: unless-stopped
    command: ["serve", "--role", "api"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    ports:
      # Loopback only. The API is unauthenticated and can be pointed at any
      # mounted path, and Docker's iptables rules bypass most host firewalls.
      - "${PHEASANT_BIND:-127.0.0.1}:${PHEASANT_PORT:-8765}:8765"
    environment: *fleet-env
    volumes:
      - ./fleet.yaml:/config/pheasant.yaml:ro
      # Read-only: the indexer is the only writer of /state. The api replica
      # polls the graph file and reloads it when the indexer rewrites it.
      - pheasant-state:/state:ro
      - ${PHEASANT_FLEET_WORKSPACE_PATH:-pheasant-workspace}:/workspace:ro
      - pheasant-memory:/memory
      # The Parquet extract, and the one volume meant to be read by
      # something that is not pheasant. Swap the named volume for a host
      # path to hand it straight to an outside service:
      #   - ${PHEASANT_EXPORTS_PATH:-./exports}:/exports
      - pheasant-exports:/exports
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  indexer:
    image: ${PHEASANT_IMAGE:-ghcr.io/esatt10/pheasant:0.10.3}
    build:
      context: ../..
    restart: unless-stopped
    command: ["serve", "--role", "indexer"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    environment: *fleet-env
    volumes:
      - ./fleet.yaml:/config/pheasant.yaml:ro
      - pheasant-state:/state
      # URL-managed repositories need to clone, fetch and fast-forward here.
      - ${PHEASANT_FLEET_WORKSPACE_PATH:-pheasant-workspace}:/workspace
      - pheasant-memory:/memory
      - pheasant-exports:/exports
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    image: ${PHEASANT_IMAGE:-ghcr.io/esatt10/pheasant:0.10.3}
    build:
      context: ../..
    restart: unless-stopped
    command: ["worker", "--transport", "grpc", "--port", "8766", "--max-workers", "16"]
    # No ports: reached only by the indexer, over the Compose network, by
    # service name. Compose round-robins DNS across the scaled replicas, and
    # the coordinator's circuit breakers take a dead one out of rotation.
    environment:
      PHEASANT_CONFIG: /config/pheasant.yaml
      # The only secret a worker gets — deliberately not the database URL.
      PHEASANT_INDEX_WORKER_TOKEN: ${PHEASANT_INDEX_WORKER_TOKEN:?set a shared worker token}
    volumes:
      - ./worker.yaml:/config/pheasant.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8766), 5).close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  pheasant-state:
  pheasant-workspace:
  pheasant-memory:
  pheasant-exports:
  pheasant-pg:
  pheasant-nats:
