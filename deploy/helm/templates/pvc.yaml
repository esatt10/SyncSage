{{- if .Values.persistence.state.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pheasant.fullname" . }}-state
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.state.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.state.size }}
{{- end }}
{{- if and .Values.persistence.exports.enabled (not .Values.persistence.exports.existingClaim) }}
---
# /exports is the volume something other than pheasant reads: a warehouse
# loader, an analytics job, a sync sidecar. It gets its own claim so that
# reader never needs access to operational state — and so the files survive a
# restart, which an emptyDir does not.
#
# Point `persistence.exports.existingClaim` at an RWX claim (EFS, Azure Files,
# NFS) when the consumer runs in its own pod; the default RWO claim is right
# when the consumer is a sidecar or a job on the same node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pheasant.fullname" . }}-exports
  labels:
    app.kubernetes.io/component: exports
spec:
  accessModes: [{{ .Values.persistence.exports.accessMode | quote }}]
  {{- with .Values.persistence.exports.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.exports.size }}
{{- end }}
