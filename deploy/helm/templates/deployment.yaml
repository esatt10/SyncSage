apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pheasant.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "pheasant.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pheasant.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pheasant.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
{{ toYaml .Values.securityContext | indent 8 }}
      containers:
        - name: pheasant
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: PHEASANT_CONFIG
              value: /config/pheasant.yaml
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: state
              mountPath: /state
            - name: workspace
              mountPath: /workspace
              readOnly: true
            - name: exports
              mountPath: /exports
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "pheasant.fullname" . }}-config
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "pheasant.fullname" . }}-state
        - name: workspace
          emptyDir: {}
        - name: exports
{{- if .Values.persistence.exports.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.exports.existingClaim | default (printf "%s-exports" (include "pheasant.fullname" .)) }}
{{- else }}
          emptyDir: {}
{{- end }}
