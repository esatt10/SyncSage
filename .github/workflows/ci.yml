name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality checks (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      - name: Run ruff lint
        run: python -m ruff check src tests scripts --no-cache

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

      - name: Check version alignment
        run: python scripts/sync_version.py --check

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run pytest suite
        run: python -m pytest -q

  package-build:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: python-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

  container-build:
    name: Container build and smoke tests
    runs-on: ubuntu-latest
    needs:
      - python-quality
      - package-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install compose helper dependency
        run: python -m pip install PyYAML

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose config
        run: |
          python -m pheasant compose-env pheasant.example.yaml --output .pheasant/compose.env
          docker compose --env-file .pheasant/compose.env config --quiet

      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pheasant:ci

      - name: Smoke test built image
        run: |
          docker run --rm pheasant:ci python -m pheasant --help
          docker run --rm pheasant:ci python -m pheasant validate /config/pheasant.yaml --no-require-paths
          docker run --rm pheasant:ci python -c "from pheasant.api.app import create_app; print(create_app(config_path='/config/pheasant.yaml').title)"
