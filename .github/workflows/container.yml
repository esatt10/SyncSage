name: Publish Container Image

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  issues: read
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pheasant
  # The web UI is a separate workload (static bundle + nginx), so it is a
  # separate image — but it is published from the same commit and tagged with
  # the same version, so `pheasant host` and docker-compose.yml can pin the two
  # together. Without this, the compose files reference a UI image that was
  # never pushed and the sidecar fails to start.
  UI_IMAGE_NAME: pheasant-ui

concurrency:
  group: publish-container-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish container image
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure CI head is still main
        shell: bash
        run: |
          current_sha="$(git rev-parse HEAD)"
          if [ "$current_sha" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "main has moved since this CI run; refusing to publish a superseded build."
            exit 1
          fi

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "ui_ref=${REGISTRY}/${owner}/${UI_IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Check version alignment
        run: python scripts/sync_version.py --check

      - name: Resolve release increment
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release_version.py merged-pr-bump \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --package "${IMAGE_NAME}" \
            --token "${GITHUB_TOKEN}"

      - name: Apply semver target on main
        id: version
        shell: bash
        run: |
          python scripts/sync_version.py --set "${{ steps.release.outputs.version }}"
          version="$(python scripts/sync_version.py --print)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check release image version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_version.py \
            --check \
            --check-ghcr-tags \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --package "${IMAGE_NAME}" \
            --token "${GITHUB_TOKEN}"

      # The staged list comes from the script that does the rewriting. It was
      # hand-maintained, and a hand-maintained copy is the standing trap here:
      # a file the script rewrites but the workflow never stages is left stale
      # on main and fails the next `--check` — which is how the compose reset
      # file ended up three releases behind.
      - name: Commit release version to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Assignment rather than a pipe into xargs: in a pipeline only the
          # last exit code survives, so a failing script would stage nothing
          # and the error would surface as a confusing empty commit.
          release_paths="$(python scripts/sync_version.py --list-paths)"
          git add -- $release_paths
          git commit -m "chore: release ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` alongside the version tag because the untagged reference in
      # the README and the setup docs — `docker run … ghcr.io/esatt10/pheasant`
      # — resolves to `:latest`, and nothing had ever pushed one, so the
      # headline install command failed with `manifest unknown`. Generated
      # artifacts still pin the version tag; `latest` exists for the copy-paste
      # one-liner, not for anything that should be reproducible.
      - name: Push semver image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.ref }}:latest

      # The UI sidecar, from the same commit and under the same version tag.
      # `latest` is pushed too so compose files from older releases (which
      # pinned `:latest`) resolve to a real image instead of failing to pull.
      - name: Push UI image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: true
          tags: |
            ${{ steps.image.outputs.ui_ref }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.ui_ref }}:latest
