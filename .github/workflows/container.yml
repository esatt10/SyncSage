name: CI and Publish Container Image

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: syncsage

jobs:
  python-quality:
    name: Python quality checks (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      - name: Run ruff lint
        run: python -m ruff check src tests scripts yaml.py sitecustomize.py --select F,B --no-cache

      - name: Check version alignment
        run: python scripts/sync_version.py --check

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run pytest suite
        run: python -m pytest -q

  package-build:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: python-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

  container-build:
    name: Container build and smoke tests
    runs-on: ubuntu-latest
    needs:
      - python-quality
      - package-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install compose helper dependency
        run: python -m pip install PyYAML

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          version="$(python scripts/sync_version.py --print)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check release image version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_version.py \
            --check-ghcr-tags \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --package "${IMAGE_NAME}" \
            --token "${GITHUB_TOKEN}"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=v${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Validate Docker Compose config
        run: |
          python -m syncsage compose-env syncsage.example.yaml --output .syncsage/compose.env
          docker compose --env-file .syncsage/compose.env config --quiet

      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: syncsage:ci
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test built image
        run: |
          docker run --rm syncsage:ci python -m syncsage --help
          docker run --rm syncsage:ci python -m syncsage validate /config/syncsage.yaml --no-require-paths
          docker run --rm syncsage:ci python -c "from syncsage.api.app import create_app; print(create_app(config_path='/config/syncsage.yaml').title)"

      - name: Push validated image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
