name: Publish Container Image

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  issues: read
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: syncsage

concurrency:
  group: publish-container-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish container image
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure CI head is still main
        shell: bash
        run: |
          current_sha="$(git rev-parse HEAD)"
          if [ "$current_sha" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "main has moved since this CI run; refusing to publish a superseded build."
            exit 1
          fi

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Check version alignment
        run: python scripts/sync_version.py --check

      - name: Resolve release increment
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release_version.py merged-pr-bump \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --package "${IMAGE_NAME}" \
            --token "${GITHUB_TOKEN}"

      - name: Apply semver target on main
        id: version
        shell: bash
        run: |
          python scripts/sync_version.py --set "${{ steps.release.outputs.version }}"
          version="$(python scripts/sync_version.py --print)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check release image version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_version.py \
            --check \
            --check-ghcr-tags \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --package "${IMAGE_NAME}" \
            --token "${GITHUB_TOKEN}"

      - name: Commit release version to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml deploy/helm/Chart.yaml deploy/helm/values.yaml deploy/kubernetes/deployment.yaml docker-compose.yml syncsage.example.yaml
          git commit -m "chore: release ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push semver image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}:${{ steps.version.outputs.version }}
