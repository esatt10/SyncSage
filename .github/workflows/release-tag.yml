name: Release Tag Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read

jobs:
  release-tag:
    name: Release tag check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require semver release label matching pyproject
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import tomllib

          labels = json.loads(os.environ.get("PR_LABELS", "[]"))
          release_labels = [label for label in labels if re.fullmatch(r"\d+\.\d+\.\d+", label)]
          with open("pyproject.toml", "rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]

          if len(release_labels) != 1:
              print("Pull request labels: " + (", ".join(labels) if labels else "(none)"))
              print(f"Add exactly one release label matching pyproject.toml version {project_version}.")
              print("Do not prefix the label with v.")
              sys.exit(1)

          if release_labels[0] != project_version:
              print(f"Release label {release_labels[0]} does not match pyproject.toml version {project_version}.")
              sys.exit(1)

          print(f"Release label accepted: {release_labels[0]}")
          PY
