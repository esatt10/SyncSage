name: Release Version Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: syncsage

jobs:
  release-version:
    name: Release version check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version alignment
        run: python scripts/sync_version.py --check

      - name: Check GHCR semver increment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_version.py \
            --check-ghcr-tags \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --package "${IMAGE_NAME}" \
            --token "${GITHUB_TOKEN}"
